branch_build_debug_for_centos7:
  stage: build
  extends: .build_by_travis_for_centos7
  variables:
    BUILD_TYPE: Debug
  except:
    - /^develop.*$/i
    - /^master.*$/i
    - tags

branch_build_release_for_centos7:
  stage: build
  variables:
    BUILD_TYPE: RelWithDebInfo
  extends: .build_by_travis_for_centos7
  except:
    - /^develop.*$/i
    - /^master.*$/i
    - tags

develop_build_debug_for_centos7:
  stage: build
  extends: .build_by_travis_for_centos7
  variables:
    BUILD_TYPE: Debug
    PACKAGE: 1
    UPLOAD_RPM: 1
    ASAN_OPTION: ADDRESS
    TESTING_VERSION_BUILD: 1
    PULP3_REPO_NAME: tsg-testing-x86_64.el7
    PULP3_DIST_NAME: tsg-testing-x86_64.el7
  artifacts:
    name: "shaping_master-$CI_COMMIT_REF_NAME-debug"
    paths:
      - build/*.rpm
  only:
    - /^develop.*$/i
    - /^master.*$/i

develop_build_release_for_centos7:
  stage: build
  extends: .build_by_travis_for_centos7
  variables:
    BUILD_TYPE: RelWithDebInfo
    PACKAGE: 1
    UPLOAD_RPM: 1
    TESTING_VERSION_BUILD: 1
    PULP3_REPO_NAME: tsg-testing-x86_64.el7
    PULP3_DIST_NAME: tsg-testing-x86_64.el7
  artifacts:
    name: "shaping_master-$CI_COMMIT_REF_NAME-release"
    paths:
      - build/*.rpm
  only:
    - /^develop.*$/i
    - /^master.*$/i

release_build_debug_for_centos7:
  stage: package
  variables:
    BUILD_TYPE: Debug
    PACKAGE: 1
    UPLOAD_RPM: 1
    PULP3_REPO_NAME: tsg-stable-x86_64.el7
    PULP3_DIST_NAME: tsg-stable-x86_64.el7
  extends: .build_by_travis_for_centos7
  artifacts:
    name: "shaping_master-$CI_COMMIT_REF_NAME-release"
    paths:
      - build/*.rpm
  only:
    - tags

release_build_release_for_centos7:
  stage: package
  variables:
    BUILD_TYPE: RelWithDebInfo
    PACKAGE: 1
    UPLOAD_RPM: 1
    UPLOAD_SYMBOL_FILES: 1
    SYMBOL_TARGET: shaping_master
    PULP3_REPO_NAME: tsg-stable-x86_64.el7
    PULP3_DIST_NAME: tsg-stable-x86_64.el7
  extends: .build_by_travis_for_centos7
  artifacts:
    name: "shaping_master-$CI_COMMIT_REF_NAME-release"
    paths:
      - build/*.rpm
  only:
    - tags

